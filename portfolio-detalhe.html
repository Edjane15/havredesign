<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalhes do Projeto - HAVREDESIGN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* Cores do tema — necessárias para as classes com opacidade funcionarem
       (ex.: text-primary-foreground/80, hover:bg-secondary/90, bg-background/95).
       Sem isto, o Tailwind CDN ignora a variante /NN e a cor fica herdada. */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#F8F4ED',
            foreground: '#0F253F',
            card: { DEFAULT: '#FFFFFF', foreground: '#0F253F' },
            popover: { DEFAULT: '#FFFFFF', foreground: '#0F253F' },
            primary: { DEFAULT: '#0F253F', foreground: '#FFFFFF' },
            secondary: { DEFAULT: '#C9B29E', foreground: '#0F253F' },
            muted: { DEFAULT: '#EFECE6', foreground: '#6B7280' },
            accent: { DEFAULT: '#C9B29E', foreground: '#0F253F' },
            destructive: { DEFAULT: '#EF4444', foreground: '#FFFFFF' },
            border: '#E5E0D8',
            input: '#E5E0D8',
            ring: '#C9B29E'
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="icon" href="./favicon.png" sizes="any" />
  <link rel="icon" href="./icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="./apple-icon.png" />
</head>
<body class="min-h-screen bg-background text-foreground">

  <!-- Loading screen com logótipo -->
  <div id="page-loader" class="page-loader" role="status" aria-live="polite">
    <img
      class="page-loader__logo"
      src="./logo.png"
      onerror="this.onerror=null;this.src='./LOGO-HAVREDESIGN.jpeg'"
      alt="HAVREDESIGN"
      width="220"
      height="110"
    />
    <div class="page-loader__track" aria-hidden="true"><span class="page-loader__bar"></span></div>
    <span class="sr-only">A carregar…</span>
  </div>

  <div id="header-mount"></div>

  <!-- Hero & Project Details -->
  <section id="project-hero" class="relative py-12 md:py-20 bg-primary text-primary-foreground">
    <div class="container mx-auto px-4">
      <a href="./portfolio.html" class="inline-flex items-center gap-2 text-secondary hover:underline mb-6 text-sm">
        ← Voltar ao Portfólio
      </a>
      <div id="project-header-content">
        <!-- Rendered via JS -->
      </div>
    </div>
  </section>

  <!-- Main Image & Spec Cards -->
  <section class="py-16">
    <div class="container mx-auto px-4">
      <div id="project-body-content" class="space-y-12 max-w-5xl mx-auto">
        <!-- Rendered via JS -->
      </div>
    </div>
  </section>

  <!-- CTA Section -->
  <section class="py-14 md:py-24 bg-secondary">
    <div class="container mx-auto px-4 text-center">
      <h2 class="font-serif text-3xl md:text-4xl text-secondary-foreground mb-4">
        Gostou deste Projeto?
      </h2>
      <p class="text-secondary-foreground/80 max-w-2xl mx-auto mb-8">
        Entre em contacto connosco e descubra como podemos conceber um espaço sob medida para as suas necessidades.
      </p>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <a href="./solicitar-projeto.html" class="inline-flex items-center justify-center px-8 py-3.5 bg-primary text-primary-foreground font-medium rounded-md hover:bg-primary/90 transition-colors">
          Solicitar Projeto Semelhante
        </a>
        <a href="./agendar.html" class="inline-flex items-center justify-center px-8 py-3.5 border border-primary text-primary font-medium rounded-md hover:bg-primary/10 transition-colors">
          Agendar conversa
        </a>
      </div>
    </div>
  </section>

  <div id="footer-mount"></div>
  <div id="whatsapp-mount"></div>

  <script src="./js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('portfolio');

      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('id') || '1';
      const allProjects = getPortfolio();
      const project = allProjects.find(p => p.id === projectId) || allProjects[0];

      const headerMount = document.getElementById('project-header-content');
      const bodyMount = document.getElementById('project-body-content');

      if (project) {
        document.title = `${project.title} - HAVREDESIGN`;

        headerMount.innerHTML = `
          <div class="max-w-3xl">
            <span class="text-secondary font-medium text-sm uppercase tracking-wider">${project.category}</span>
            <h1 class="font-serif text-4xl md:text-5xl lg:text-6xl leading-tight my-4">
              ${project.title}
            </h1>
            <p class="text-xl text-primary-foreground/80">
              ${project.description}
            </p>
          </div>
        `;

        const gallery = project.gallery && project.gallery.length > 0 ? project.gallery : [project.imageUrl];

        bodyMount.innerHTML = `
          <!-- Meta stats bar -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-card p-6 rounded-lg border border-border shadow-sm text-center">
            <div>
              <p class="text-xs text-muted-foreground uppercase font-semibold">Categoria</p>
              <p class="font-serif text-lg font-bold text-foreground mt-1">${project.category}</p>
            </div>
            <div>
              <p class="text-xs text-muted-foreground uppercase font-semibold">Área</p>
              <p class="font-serif text-lg font-bold text-foreground mt-1">${project.area || 'N/A'}</p>
            </div>
            <div>
              <p class="text-xs text-muted-foreground uppercase font-semibold">Ano</p>
              <p class="font-serif text-lg font-bold text-foreground mt-1">${project.year || 'N/A'}</p>
            </div>
            <div>
              <p class="text-xs text-muted-foreground uppercase font-semibold">Localização</p>
              <p class="font-serif text-lg font-bold text-foreground mt-1">${project.location || 'Angola'}</p>
            </div>
          </div>

          <!-- Featured Main Image -->
          <div class="aspect-[16/9] rounded-lg overflow-hidden shadow-lg bg-muted">
            <img loading="lazy" decoding="async" src="${project.imageUrl}" alt="${project.title}" class="object-cover w-full h-full" onerror="this.src='./assets/hero-section.png'" />
          </div>

          <!-- Gallery Grid -->
          <div class="space-y-6 pt-8">
            <h3 class="font-serif text-2xl text-foreground">Galeria do Projeto</h3>
            <div class="grid md:grid-cols-2 gap-6">
              ${gallery.map(imgUrl => `
                <div class="aspect-[4/3] rounded-lg overflow-hidden shadow-sm bg-muted">
                  <img loading="lazy" decoding="async" src="${imgUrl}" alt="${project.title}" class="object-cover w-full h-full hover:scale-105 transition-transform duration-500" onerror="this.src='./assets/hero-section.png'" />
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
